<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proiecte | Portofoliu Alexia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-teal-100 via-white to-sky-100 min-h-screen text-gray-800 font-sans antialiased flex flex-col">

    <!-- Navigația Fixă și Responsivă (cu Overlay pe mobil) -->
    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 relative">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-600 to-sky-600">Radu Alexia-Iulia</a>
            
            <!-- Butonul Hamburger -->
            <button id="mobileMenuBtn" class="md:hidden text-gray-600 hover:text-teal-600 focus:outline-none">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            <!-- Meniul: Poziționat absolut pe mobil (overlay), normal pe desktop -->
            <div id="navMenu" class="hidden absolute top-full left-0 w-full bg-white/95 backdrop-blur-md shadow-xl border-t border-gray-100 py-4 md:static md:w-auto md:bg-transparent md:shadow-none md:border-none md:py-0 md:flex flex-col md:flex-row gap-6 font-medium text-gray-600 items-center transition-all">
                <a href="index.html" class="hover:text-teal-600 transition-colors w-full text-center md:w-auto py-2 md:py-0">Acasă</a>
                <a href="about.html" class="hover:text-teal-600 transition-colors w-full text-center md:w-auto py-2 md:py-0">Despre</a>
                <a href="projects.html" class="hover:text-teal-600 transition-colors w-full text-center md:w-auto py-2 md:py-0">Proiecte</a>
                <a href="contact.html" class="hover:text-teal-600 transition-colors w-full text-center md:w-auto py-2 md:py-0">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Conținut Proiecte -->
    <main class="flex-grow max-w-5xl mx-auto w-full p-6 mt-6">
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <h3 class="text-3xl font-extrabold text-gray-800">Proiecte GitHub</h3>
            <input type="text" id="searchInput" placeholder="Caută un proiect..." 
                class="w-full md:w-1/2 lg:w-1/3 px-5 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-teal-500 shadow-sm bg-white/90">
        </div>

        <div id="loader" class="text-center py-10">
            <div class="animate-spin inline-block w-10 h-10 border-[4px] border-current border-t-transparent text-teal-600 rounded-full"></div>
            <p class="mt-4 text-teal-800 font-medium">Sincronizare cu GitHub...</p>
        </div>

        <div id="errorBox" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-center shadow-md mb-8">
            <span id="errorMessage"></span>
        </div>

        <div id="reposContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        <div class="text-center mt-12 mb-8">
            <button id="loadMoreBtn" class="hidden bg-white border-2 border-teal-500 text-teal-700 hover:bg-teal-50 font-bold py-2.5 px-8 rounded-full transition-all">
                Afișează mai multe
            </button>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
