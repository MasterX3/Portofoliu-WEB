<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Portofoliu Alexia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-teal-100 via-white to-sky-100 min-h-screen text-gray-800 font-sans antialiased flex flex-col">

    <!-- Navigația -->
    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center flex-wrap">
            <a href="index.html" class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-600 to-sky-600">Alexia.</a>
            
            <button id="mobileMenuBtn" class="md:hidden text-gray-600 hover:text-teal-600 focus:outline-none">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            <!-- Meniul (ascuns pe mobil, vizibil pe desktop) -->
            <div id="navMenu" class="hidden w-full md:w-auto md:flex flex-col md:flex-row gap-6 font-medium text-gray-600 mt-4 md:mt-0 items-center">
                <a href="index.html" class="hover:text-teal-600 transition-colors py-2 md:py-0">Acasă</a>
                <a href="about.html" class="hover:text-teal-600 transition-colors py-2 md:py-0">Despre</a>
                <a href="projects.html" class="hover:text-teal-600 transition-colors py-2 md:py-0">Proiecte</a>
                <a href="contact.html" class="text-teal-600 hover:text-teal-800 transition-colors py-2 md:py-0">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Conținut Contact -->
    <main class="flex-grow max-w-2xl mx-auto w-full p-6 mt-6">
        <div class="bg-white/80 backdrop-blur-md rounded-xl shadow-sm p-8 border-t-4 border-teal-500">
            <h1 class="text-3xl font-extrabold text-gray-800 mb-2">Hai să discutăm!</h1>
            <p class="text-gray-600 mb-8">Ai o idee de proiect sau un internship disponibil? Lasă-mi un mesaj.</p>

            <!-- Container mesaje validare -->
            <div id="formStatus" class="hidden mb-6 p-4 rounded-lg font-medium text-sm text-center"></div>

            <form id="contactForm" novalidate class="space-y-5">
                <div>
                    <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">Nume complet</label>
                    <input type="text" id="name" name="name" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-shadow">
                </div>
                
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Adresă de Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-shadow">
                </div>

                <div>
                    <label for="message" class="block text-sm font-semibold text-gray-700 mb-1">Mesaj</label>
                    <textarea id="message" name="message" rows="5" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-shadow resize-none"></textarea>
                </div>

                <button type="submit" 
                    class="w-full bg-gradient-to-r from-teal-600 to-sky-600 text-white font-bold py-3 px-4 rounded-lg hover:from-teal-700 hover:to-sky-700 transition-colors shadow-md">
                    Trimite Mesajul
                </button>
            </form>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
